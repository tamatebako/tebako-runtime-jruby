name: build-payload
# jruby feedstock: image (once, UNIVERSAL) → pair (per triplet) → (on
# tags) publish. spec 33's runtime-on-runtime form: the env image is the
# jruby home (bytecode + every platform's jffi stub — ONE universal
# asset), composed ON the published temurin java owner at dispatch.
# The pair matrix is the temurin owner's full v2.8.50 surface (eight
# triplets — the recipe's flavors.jvm.platforms is the SSOT): musl legs
# smoke inside the leg's tpkg-builder container, windows legs are
# runner-native, and the win-arm64 leg waives the shim-driven smokes —
# tebako ships no ucrt-arm64 tebako-shim (the recipe's no_native_shim
# list) and an emulated x64 shim cannot substitute: the store scan's
# platform filter is the dispatcher's compiled-in arch, so it never sees
# the arm64 store entries. pins.rb emits COMPOSED_SMOKE=0 there; the
# composed windows wire is proven on the x86_64 leg.
#
# kind: runtime (spec 28/29/33): the image job ships the universal .tfs
# (+ sidecar + the release-tier manifest); each pair leg ships the
# wrapper exe (tebako-runtime-launcher, byte-identical to
# tamatebako/tebako's own asset) + sidecar + the per-triplet release
# shard (image.filename = the universal asset — entry_asset_names flows
# it verbatim, no product change). The pair legs' smokes: the spec 33 §5
# standalone fail-closed gate (exit 65 on POSIX legs, 78 on windows legs —
# the layout check precedes the grant refusal) + the COMPOSED wire (shim →
# jruby → temurin owner) + the cext negative cell (a native-abi payload
# fails by name at dispatch — the shard's abi:"none" sentinel); the two
# shim-driven cells are waived on a leg whose platform the pinned line
# ships no dispatcher for (the win-arm64 leg — see the matrix comment). The publish job uploads all of it, derives the monoliths
# (manifest.json + SHA256SUMS.txt, trr#140) from the shards + sidecars,
# renders the registry entry from manifests/registry.yaml, and lands it
# by bot PR. The bot PR rides the tebako-fleet App's installation token
# (tebako#686, tebako-release#3): a GITHUB_TOKEN-authored PR never
# triggers pull_request workflows, so its checks would pend forever and
# auto-merge never fire — and an App token carries its own rate budget
# instead of spending a shared user PAT. The legs below skip the bot
# PR's registry-only file set.
# `tebako publish` is NOT used: the CLI refuses kind: runtime.
#
# TRUST PLANE (all gates off byte-identical — spec 00 invariant 7): the
# x86_64 windows leg Azure-Trusted-Signs the fetched wrapper exe IN-LEG
# before tools/build pairs+hashes it (spec 34 §8.2 — sign-then-hash by
# construction, never a re-hash), and the macos legs Developer-ID-sign +
# notarize it the same way (spec 31 §5/§8.4 — the
# tools/runtime.entitlements pair, gated on the APPLE_SIGNING_ENABLED
# repo variable). The win-arm64 leg ships Authenticode-unsigned by the
# ecosystem's deliberate posture (the product ships its own
# windows-ucrt-arm64 binaries unsigned the same way; the arm64
# Azure-signing story is the product's phase 3), and every leg OpenPGP-
# signs its own served names right after the publish job uploads them
# on signing-enabled lines (spec 09 §5, the tebako-release gem's
# signer). The wrapper is this repo's ONE shippable host-level
# executable: the imager and the composed smoke's tebako-shim are
# build/test tools, never shipped, so they never stage for signing.
#
# PIN DISCIPLINE (the owner's rule): this workflow carries NO version or
# digest literals. Tebakofile is the SSOT — the `tools:` block pins the
# tfs CLI + tebako-shim (release + per-platform sha256, cross-checked
# against the release's own SHA256SUMS), the `runtime:` block pins the
# wrapper's product line, flavors.jvm.owner_smoke pins the published
# temurin pair (two-anchor verified at fetch); tools/pins.rb reads them
# into $GITHUB_ENV.
on:
  push:
    branches: [main]
    # A registry-bot or docs-only merge cannot change a build's outcome, so
    # it does not re-run the matrix (tebako#866). GitHub does not evaluate
    # path filters for tag pushes, so a release tag still builds.
    paths-ignore:
      - tpkg-registry.yaml
      - "**/*.md"
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  # Registry-only detection (tebako#686): the tag run's publish job
  # lands tpkg-registry.yaml by bot PR, and such a PR's whole change
  # set is that one file. The decision rides the FILES, never the
  # publish/* branch-name convention: the image/pair legs skip exactly
  # this file set; every other PR — and every non-PR event, where this
  # job never runs — builds unchanged.
  changes:
    name: registry-only change detection
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      registry_only: ${{ steps.detect.outputs.registry_only }}
    steps:
      - name: Detect the registry-only file set
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          files="$(gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" \
            --json files --jq '[.files[].path] | sort | join(",")')"
          echo "changed files: $files"
          if [ "$files" = "tpkg-registry.yaml" ]; then
            echo "registry_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "registry_only=false" >> "$GITHUB_OUTPUT"
          fi
  image:
    # The UNIVERSAL env image, built once (the dist has no per-platform
    # variants; mkimage is not byte-reproducible across legs — the
    # created timestamp — so ONE leg's image is THE published asset).
    name: image / universal
    needs: changes
    # tebako#686: a registry-only bot PR skips the legs (its change set
    # is exactly tpkg-registry.yaml). A skipped changes job — every
    # non-PR event — never suppresses the legs, and neither does a
    # detection failure (a missing output reads as "not registry-only":
    # the safe default is to build).
    if: ${{ always() && (github.event_name != 'pull_request' || needs.changes.outputs.registry_only != 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the toolchain pins (Tebakofile is the SSOT)
        shell: bash
        run: ruby tools/pins.rb linux-gnu-x86_64 jvm --env >> "$GITHUB_ENV"
      - name: Fetch the imager (pinned by Tebakofile, sha256-verified)
        shell: bash
        env:
          TFS_BIN: .packager/tfs
        run: |
          set -euo pipefail
          mkdir -p .packager
          base="https://github.com/tamatebako/tebako/releases/download/$TEBAKO_RELEASE"
          curl -sL --fail -o "$TFS_BIN" "$base/$TFS_ASSET"
          curl -sL --fail -o SHA256SUMS "$base/SHA256SUMS"
          echo "$TFS_SHA256  $TFS_BIN" | sha256sum -c -
          # The pin must agree with the release's own sums (both anchored).
          got=$(awk -v a="$TFS_ASSET" '$2 == a {print $1}' SHA256SUMS)
          [ "$got" = "$TFS_SHA256" ] || { echo "::error::pin mismatch for $TFS_ASSET: Tebakofile=$TFS_SHA256 release=${got:-ABSENT}"; exit 1; }
          chmod +x "$TFS_BIN"
          "$TFS_BIN" > /dev/null
      - name: Build the universal env image
        shell: bash
        env:
          ROLE: image
          TFS_CLI: .packager/tfs
        run: tools/build
      - name: Upload the image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-universal
          path: out/image/
          retention-days: 7

  pair:
    # Per triplet: the wrapper exe + sidecar + the per-triplet shard, and
    # the smokes against THIS platform's published temurin owner.
    name: pair / ${{ matrix.platform.triplet }}
    needs: [changes, image]
    # tebako#686: same registry-only skip as the image leg; the
    # needs.image.result arm keeps today's implicit "the image
    # succeeded" dependency exact under an explicit if.
    if: ${{ always() && needs.image.result == 'success' && (github.event_name != 'pull_request' || needs.changes.outputs.registry_only != 'true') }}
    runs-on: ${{ matrix.platform.os }}
    # Spec 34 §3/§8.2 (the mirror of tebako-runtime-bun's
    # build-payload.yml): a job-level permissions block REPLACES the
    # workflow-level grant, so it is restated here — plus id-token:write,
    # the OIDC boundary: the Entra federated credential issues Azure
    # tokens only to a job of this repo running in the windows-signing
    # environment. The signing steps below are gated on
    # WINDOWS_SIGNING_ENABLED: unsigned runs carry the environment but
    # never request a token. (Attestations stay with the publish job —
    # the pair legs never attest.)
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    # Spec 34's attestation boundary (see the id-token note above). The
    # pair job is shared by every platform's legs — only the x86_64
    # windows leg ever arms the signing chain, but ALL legs carry the
    # environment: it must NEVER gain required reviewers (that would gate
    # every platform's build on an approval); protection rules stay
    # empty.
    environment: windows-signing
    strategy:
      fail-fast: false
      matrix:
        # Identity only (which leg, which runner, which exe suffix, which
        # container). The matrix MIRRORS Tebakofile's flavors.jvm.platforms
        # coverage (the recipe is the SSOT; the registry rows name the same
        # list) — the full temurin owner surface the openjdk factory ships
        # at v2.8.50. The musl legs run their smokes INSIDE the leg's
        # tpkg-builder container (alpine, musl libc — the pinned musl
        # binaries + the owner JRE execute only there; the sibling
        # factories' container-leg grammar) while the fetches stay on the
        # glibc host (pure downloads + hash checks). The windows legs are
        # runner-native; jruby's pair role untars nothing, so no msys2
        # setup rides either (and no leg runs a bundler — the publish job
        # is the central macos one — so the win-arm64 leg needs no
        # clangarm64 toolchain; cf. openjdk#69's bundle-step need, absent
        # here).
        platform:
          - triplet: aarch64-macos
            asset_platform: macos-arm64
            os: macos-15
            exe_suffix: ""
          # The Intel macOS leg rides the macos-15-intel runner (macos-13
          # is retired; the openjdk factory's same leg runs there).
          - triplet: x86_64-macos
            asset_platform: macos-x86_64
            os: macos-15-intel
            exe_suffix: ""
          - triplet: x86_64-linux-gnu
            asset_platform: linux-gnu-x86_64
            os: ubuntu-24.04
            exe_suffix: ""
          - triplet: aarch64-linux-gnu
            asset_platform: linux-gnu-arm64
            os: ubuntu-24.04-arm
            exe_suffix: ""
          - triplet: x86_64-linux-musl
            asset_platform: linux-musl-x86_64
            os: ubuntu-24.04
            exe_suffix: ""
            container: ghcr.io/tamatebako/tpkg-builder-x86_64-linux-musl:v1
          - triplet: aarch64-linux-musl
            asset_platform: linux-musl-arm64
            os: ubuntu-24.04-arm
            exe_suffix: ""
            container: ghcr.io/tamatebako/tpkg-builder-aarch64-linux-musl:v1
          - triplet: x86_64-windows-ucrt
            asset_platform: windows-ucrt64
            os: windows-latest
            exe_suffix: .exe
          # The win-arm64 leg rides the windows-11-arm runner (the label
          # the product repo + the openjdk/bun factories' arm64 legs use).
          # tebako ships no windows-ucrt-arm64 tebako-shim (the recipe's
          # no_native_shim): pins.rb emits no TEBAKO_SHIM_* pins +
          # COMPOSED_SMOKE=0, the dispatcher fetch step skips, and
          # tools/build waives the shim-driven smokes — the pair, the
          # standalone fail-closed gate (exit 78 on windows: the layout
          # check precedes the grant refusal), and every pin cross-check
          # (the owner sidecars included) still run.
          - triplet: aarch64-windows-ucrt
            asset_platform: windows-ucrt-arm64
            os: windows-11-arm
            exe_suffix: .exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the toolchain pins (Tebakofile is the SSOT)
        id: pins
        shell: bash
        run: |
          pins="$(ruby tools/pins.rb "${{ matrix.platform.asset_platform }}" jvm --env)"
          printf '%s\n' "$pins" >> "$GITHUB_ENV"
          # The dispatcher fetch below skips when the pinned line ships no
          # tebako-shim for this platform (the recipe's no_native_shim —
          # pins.rb emits no TEBAKO_SHIM_ASSET there).
          if printf '%s\n' "$pins" | grep -q '^TEBAKO_SHIM_ASSET='; then
            echo "has_shim=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_shim=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch the imager (pinned by Tebakofile, sha256-verified)
        shell: bash
        env:
          TFS_BIN: .packager/tfs${{ matrix.platform.exe_suffix }}
          CONTAINER: ${{ matrix.platform.container }}
        run: |
          set -euo pipefail
          mkdir -p .packager
          base="https://github.com/tamatebako/tebako/releases/download/$TEBAKO_RELEASE"
          curl -sL --fail -o "$TFS_BIN" "$base/$TFS_ASSET"
          curl -sL --fail -o SHA256SUMS "$base/SHA256SUMS"
          echo "$TFS_SHA256  $TFS_BIN" | { sha256sum -c - 2>/dev/null || shasum -a 256 -c -; }
          got=$(awk -v a="$TFS_ASSET" '$2 == a {print $1}' SHA256SUMS)
          [ "$got" = "$TFS_SHA256" ] || { echo "::error::pin mismatch for $TFS_ASSET: Tebakofile=$TFS_SHA256 release=${got:-ABSENT}"; exit 1; }
          chmod +x "$TFS_BIN"
          # Bare invocation prints the help and exits 0 (tfs has no
          # --version flag): the dead-binary smoke. The musl legs' imager
          # executes only under a musl userland — the smoke rides the
          # leg's container, the workspace bind-mounted at its host path
          # so the relative TFS_BIN holds.
          if [ -n "$CONTAINER" ]; then
            docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
              "$CONTAINER" "$TFS_BIN" > /dev/null
          else
            "$TFS_BIN" > /dev/null
          fi
      - name: Fetch the wrapper (pinned by Tebakofile)
        shell: bash
        env:
          WRAPPER_BIN: .packager/tebako-runtime-launcher
        run: |
          set -euo pipefail
          mkdir -p .packager
          base="https://github.com/tamatebako/tebako/releases/download/$WRAPPER_RELEASE"
          curl -sL --fail -o "$WRAPPER_BIN" "$base/$WRAPPER_ASSET"
          echo "$WRAPPER_SHA256  $WRAPPER_BIN" | { sha256sum -c - 2>/dev/null || shasum -a 256 -c -; }
          chmod +x "$WRAPPER_BIN"
          echo "WRAPPER_BIN=$PWD/.packager/tebako-runtime-launcher" >> "$GITHUB_ENV"
      # The dispatcher for the composed smoke (spec 33's real wire: shim
      # → dep runtime → owner runtime). Same two-anchor rule as the
      # imager. Skipped where the pinned line ships no native shim (the
      # recipe's no_native_shim — pins.rb then emits no TEBAKO_SHIM_*
      # pins, and tools/build waives the shim-driven cells).
      - name: Fetch the dispatcher (tebako-shim, pinned by Tebakofile)
        if: steps.pins.outputs.has_shim == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .packager
          base="https://github.com/tamatebako/tebako/releases/download/$TEBAKO_RELEASE"
          curl -sL --fail -o .packager/tebako-shim "$base/$TEBAKO_SHIM_ASSET"
          curl -sL --fail -o SHA256SUMS "$base/SHA256SUMS"
          echo "$TEBAKO_SHIM_SHA256  .packager/tebako-shim" | { sha256sum -c - 2>/dev/null || shasum -a 256 -c -; }
          got=$(awk -v a="$TEBAKO_SHIM_ASSET" '$2 == a {print $1}' SHA256SUMS)
          [ "$got" = "$TEBAKO_SHIM_SHA256" ] || { echo "::error::pin mismatch for $TEBAKO_SHIM_ASSET: Tebakofile=$TEBAKO_SHIM_SHA256 release=${got:-ABSENT}"; exit 1; }
          chmod +x .packager/tebako-shim
          echo "SHIM_BIN=$PWD/.packager/tebako-shim" >> "$GITHUB_ENV"

      # Spec 31 §5/§8.4 — the macOS Apple-plane leg (the port of
      # tebako-runtime-node's sign step, itself the python → ruby
      # factories' proven pattern): the fetched wrapper exe is
      # Developer-ID-signed (hardened runtime, the
      # tools/runtime.entitlements pair) and notarized here — after its
      # pin-verified download, BEFORE tools/build pairs it into out/ and
      # computes the .sha256 sidecar + the release shard's digest, so
      # every published hash anchors the SIGNED bytes by construction
      # (sign-then-hash, the same in-leg placement the windows block
      # below follows) and the wrapper smoke inside tools/build
      # exercises exactly the shipped bytes.
      # Gate: APPLE_SIGNING_ENABLED (the repo variable) — unsigned
      # stays first-class without it (spec 00 invariant 7); armed + a
      # missing secret is a fast named failure.
      - name: Sign + notarize the runtime exe (macos, spec 31)
        if: contains(matrix.platform.triplet, '-macos')
        shell: bash
        env:
          APPLE_SIGNING_ENABLED: ${{ vars.APPLE_SIGNING_ENABLED }}
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ASC_KEY_P8: ${{ secrets.APPLE_ASC_KEY_P8 }}
          APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          bash tools/macos-sign-notarize-runtime.sh "$WRAPPER_BIN"

      # Spec 34 §8.2 — the Windows Authenticode leg (the port of
      # tebako-runtime-bun's sign block, itself tebako-runtime-ruby#157's
      # _build-platform.yml ← tamatebako/tebako PR #566+#570): when the
      # repo variable WINDOWS_SIGNING_ENABLED=true, the fetched wrapper
      # exe is Azure Trusted Signed here — after its pin-verified
      # download, BEFORE tools/build pairs it into out/. X64 ONLY by
      # deliberate posture: the aarch64 leg's wrapper passes through
      # unsigned (the product ships its own windows-ucrt-arm64 binaries
      # Authenticode-unsigned; the arm64 signing story is the product's
      # phase 3 — when it lands, this block's condition widens to both
      # windows legs). Signing rides a sign-staging/ COPY, never the
      # contract path directly (the trr#157 shape): the action
      # enumerates by EXTENSION, so the staging step copies the wrapper
      # under sign-staging/ with a PE extension, the action signs there,
      # and the verify step moves the signed bytes BACK over the contract
      # path ($WRAPPER_BIN) before signtool-verifying it there (signtool
      # verifies content, not filename). Sign-then-hash (spec 34 §1.3)
      # needs NO re-hash step: tools/build computes the wrapper's
      # .sha256 sidecar + the release shard's digest AFTER this block, so
      # every published hash anchors the SIGNED bytes by construction,
      # and tools/build's wrapper smoke exercises exactly the shipped
      # bytes. Gate off: every step below skips and the leg ships
      # unsigned, byte-identically to today (spec 00 invariant 7 — §7.4
      # gate-off parity).
      - name: Arm check — Windows signing (spec 34 §4)
        if: matrix.platform.triplet == 'x86_64-windows-ucrt'
        id: signgate
        shell: bash
        env:
          WINDOWS_SIGNING_ENABLED: ${{ vars.WINDOWS_SIGNING_ENABLED }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_ENDPOINT: ${{ vars.AZURE_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_SIGNING_ACCOUNT_NAME }}
          AZURE_SIGNING_CERT_PROFILE: ${{ vars.AZURE_SIGNING_CERT_PROFILE }}
        run: bash tools/windows-sign-gate.sh

      # The sign-staging copy (the §7.3 soundness shape — trr#157's fix
      # for run 34490217493, where extension enumeration signed only the
      # .dll and the contract exe escaped): this repo ships exactly ONE
      # host-level PE — the wrapper (the imager and the composed smoke's
      # tebako-shim are build/test tools, never shipped, so they NEVER
      # stage). The wrapper rides .packager/ SUFFIXLESS here, so stage it
      # as <name>.exe: the action's extension filter then covers it by
      # construction. COPY, never move: the unsigned original keeps the
      # contract path until the verify step restores the signed bytes
      # over it.
      - name: Stage the PE artifacts for signing (spec 34 §7.3)
        if: steps.signgate.outputs.armed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s "$WRAPPER_BIN" || { echo "::error::spec 34 §7.3: no wrapper executable at $WRAPPER_BIN — nothing to sign"; exit 1; }
          mkdir -p sign-staging
          case "$(basename "$WRAPPER_BIN")" in
            *.exe|*.dll) cp "$WRAPPER_BIN" "sign-staging/$(basename "$WRAPPER_BIN")" ;;
            *) cp "$WRAPPER_BIN" "sign-staging/$(basename "$WRAPPER_BIN").exe" ;;
          esac
          ls -l sign-staging/

      # OIDC workload-identity federation (spec 34 §3): no stored client
      # secret anywhere; the federated credential is scoped to this repo
      # × the windows-signing environment this job runs in.
      - name: Azure login (OIDC, spec 34 §8.2)
        if: steps.signgate.outputs.armed == 'true'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2 (sha-pinned 2026-09-11; the v2 tag's v2.3.1 commit, proven on tamatebako/tebako#566+#570 + trr#157)
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Preflight the TrustedSigning module (spec 34 §8.2)
        if: steps.signgate.outputs.armed == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # PSGallery must be REGISTERED before Install-Module can name it
          # (the runner image no longer guarantees the default
          # registration); a healthy registration is a no-op.
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
          }
          # The action caches the module at the CurrentUser path while its
          # own Install-Module lands AllUsers on the elevated runner — a
          # cache hit restores a 23 KiB stub and the action SKIPS the
          # install, leaving Invoke-TrustedSigning unrecognized (the ruby
          # factory's 2026-09-21 legs; tebako-runtime-node#41's windows
          # legs died of exactly this on 2026-11-14). Install to
          # CurrentUser HERE, before the action's cache step: the post-job
          # save then captures a real module, and a poisoned restore can
          # only overlay — never delete — these bytes.
          if (-not (Get-Module -ListAvailable TrustedSigning)) {
            Install-Module -Name TrustedSigning -RequiredVersion 0.5.8 -Repository PSGallery -Scope CurrentUser -Force -AllowClobber
          }
          Import-Module TrustedSigning -Force
          Get-Command Invoke-TrustedSigning | Out-Null
          Write-Host "TrustedSigning module ready: $((Get-Module TrustedSigning).Version)"

      # Signs the staged PE artifacts in sign-staging/ (the staging step
      # above copied the wrapper there for extension enumeration; the
      # verify step below restores the signed bytes over the contract
      # path). The account input is `signing-account-name` — spec 34
      # §5's draft `trusted-signing-account-name` is the deprecated alias
      # at this action's @v1 (the PR #566 deviation, verified against the
      # action's action.yml); do not "upgrade" the action — @v2 dropped
      # the input.
      - name: Sign the staged PE artifacts (spec 34 §8.2)
        if: steps.signgate.outputs.armed == 'true'
        uses: Azure/artifact-signing-action@b443cf8ea4124818d2ea9f043cba29fc3ec47b16 # v1 (sha-pinned 2026-09-11; proven on tamatebako/tebako#566+#570 + trr#157)
        with:
          endpoint: ${{ vars.AZURE_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_CERT_PROFILE }}
          files-folder: sign-staging
          # The enumeration gate (§7.3): everything PE signs by
          # EXTENSION, never a name list. Sound by construction here: the
          # staging dir carries only the wrapper-as-.exe, so the filter
          # can miss nothing the gate below would not also catch by name.
          files-folder-filter: exe,dll
          file-digest: SHA256
          # §1.4: the RFC 3161 countersignature is mandatory (the action's
          # default timestamp server; set explicitly per spec).
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: tebako jruby runtime wrapper (tamatebako)

      - name: Verify the signatures (spec 34 §7.1/§7.2)
        if: steps.signgate.outputs.armed == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # §7.3: enumerate the SIGNED set by EXTENSION at the staging
          # dir, never a name list.
          $exes = @(Get-ChildItem -Path 'sign-staging' -Filter '*.exe' -File)
          $dlls = @(Get-ChildItem -Path 'sign-staging' -Filter '*.dll' -File)
          $pes = @($exes) + @($dlls)
          # The fail-closed enumeration gate (§7.3), this repo's shape:
          # (a) the contract exe — the wrapper — present in the signed
          # set by (staged) name, AND (b) >=1 PE signed total. NOT a
          # dll-nonempty gate: this repo ships no loose DLL at release
          # level (jruby lives INSIDE the .tfs env image).
          if ($pes.Count -eq 0) {
            Write-Host "::error::spec 34 §7.3: no signed PE artifacts under sign-staging"
            exit 1
          }
          $wrapperBin = $env:WRAPPER_BIN
          # $WRAPPER_BIN is exported from a git-bash step as an MSYS
          # absolute path (/d/a/...) — pwsh runs Win32 paths, so
          # translate before Test-Path/Move-Item.
          if ($wrapperBin -match '^/([a-zA-Z])/(.*)$') {
            $wrapperBin = ($Matches[1] + ':\' + ($Matches[2] -replace '/', '\'))
          }
          $wrapperName = Split-Path $wrapperBin -Leaf
          $stagedName = $wrapperName
          if ($wrapperName -notmatch '\.(exe|dll)$') { $stagedName = "$wrapperName.exe" }
          $stagedExe = "sign-staging/$stagedName"
          if (-not (Test-Path $stagedExe -PathType Leaf)) {
            Write-Host "::error::spec 34 §7.3: $stagedExe missing after the sign action — the wrapper exe escaped signing"
            exit 1
          }
          # Restore the CONTRACT-named path with the signed bytes,
          # replacing the unsigned original the staging step left in
          # place — tools/build then pairs + hashes + smokes exactly the
          # shipped (signed) bytes (sign-then-hash, §1.3). The verify
          # loop below runs at the restored path: signtool verifies
          # content, not filename.
          Move-Item -Force $stagedExe $wrapperBin
          $restored = @(Get-Item $wrapperBin)
          # signtool.exe: the action's cached BuildTools first (the
          # TrustedSigning module still owns that directory name at
          # action @v1; the ArtifactSigning spelling is kept as a
          # forward-compat fallback), then the runner image's Windows
          # Kits; newest path first.
          $signtool = @(
            Get-ChildItem -Path "$env:LOCALAPPDATA\TrustedSigning\Microsoft.Windows.SDK.BuildTools" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue
            Get-ChildItem -Path "$env:LOCALAPPDATA\ArtifactSigning\Microsoft.Windows.SDK.BuildTools" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue
            Get-ChildItem -Path 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue
          ) | Where-Object { $_.FullName -match '\\x64\\' } |
              Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) {
            Write-Host "::error::spec 34 §7.1: signtool.exe not found (action BuildTools cache and Windows Kits both empty)"
            exit 1
          }
          Write-Host "signtool: $($signtool.FullName)"
          $failed = $false
          foreach ($pe in $restored) {
            Write-Host "== signtool verify /pa /v $($pe.Name)"
            $out = & $signtool.FullName verify /pa /v $pe.FullName 2>&1 | Out-String
            Write-Host $out
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::spec 34 §7.1: signtool verify /pa FAILED for $($pe.Name)"
              $failed = $true
              continue
            }
            # §7.2/§1.4: the RFC 3161 countersignature is mandatory — an
            # untimestamped signature fails the leg, never a warning.
            if ($out -notmatch 'signature is timestamped' -and $out -notmatch 'RFC ?3161') {
              Write-Host "::error::spec 34 §7.2: no RFC 3161 timestamp countersignature in signtool output for $($pe.Name)"
              $failed = $true
              continue
            }
            $sig = Get-AuthenticodeSignature $pe.FullName
            if ($sig.Status -ne 'Valid') {
              Write-Host "::error::spec 34 §7.1: Get-AuthenticodeSignature status '$($sig.Status)' (not Valid) for $($pe.Name)"
              $failed = $true
              continue
            }
            if ($null -eq $sig.TimeStamperCertificate) {
              Write-Host "::error::spec 34 §7.2: Get-AuthenticodeSignature reports no TimeStamperCertificate for $($pe.Name)"
              $failed = $true
              continue
            }
            Write-Host "signed+timestamped: $($pe.Name) — $($sig.SignerCertificate.Subject)"
          }
          if ($failed) { exit 1 }

      # The image leg's universal image (the pair leg never rebuilds it —
      # one image, one digest).
      - name: Download the universal image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-universal
          path: out/image/
      - name: Pair the wrapper + run the smokes
        shell: bash
        env:
          ROLE: pair
          TRIPLET: ${{ matrix.platform.triplet }}
          ASSET_PLATFORM: ${{ matrix.platform.asset_platform }}
          EXE_SUFFIX: ${{ matrix.platform.exe_suffix }}
          TFS_CLI: .packager/tfs${{ matrix.platform.exe_suffix }}
          IMAGE_TARBALL: out/image
          CONTAINER: ${{ matrix.platform.container }}
        # WRAPPER_BIN / SHIM_BIN (the fetch steps) and the OWNER_*/DEP_*
        # composed-smoke pins (pins.rb) flow through $GITHUB_ENV — process
        # env, not the static env: context.
        run: |
          set -euo pipefail
          if [ -n "$CONTAINER" ]; then
            # The musl leg: every binary tools/build executes is
            # musl-linked — the imager (the probe payloads' mkimage), the
            # wrapper (the negative smoke), the shim, the owner JVM (the
            # composed smoke) — so the pair + the smokes run INSIDE the
            # leg's tpkg-builder container (alpine, musl libc; bash, curl,
            # ca-certificates, ruby and coreutils are baked in). The
            # workspace bind-mounts at its host path so the pins' paths
            # ($PWD-anchored WRAPPER_BIN/SHIM_BIN, relative TFS_CLI /
            # IMAGE_TARBALL) hold verbatim inside.
            docker run --rm \
              -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
              -e ROLE -e TRIPLET -e ASSET_PLATFORM -e EXE_SUFFIX -e TFS_CLI -e FLAVOR \
              -e WRAPPER_BIN -e SHIM_BIN -e IMAGE_TARBALL -e GITHUB_REF_NAME \
              -e OWNER_REPO -e OWNER_RELEASE -e OWNER_STEM -e OWNER_STORE_ID \
              -e OWNER_EXE_SHA256 -e OWNER_IMAGE_SHA256 -e DEP_STORE_ID \
              "$CONTAINER" bash tools/build
          else
            tools/build
          fi
      # The container builds as root; the bind-mounted out/ tree lands
      # root-owned on the host, and the upload step must read it (the
      # sibling factories' handback — bun's host-side shape).
      - name: Hand the container's outputs back to the host user
        if: matrix.platform.container != null
        run: sudo chown -R "$USER:$USER" out .packager
      - name: Upload payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: payload-${{ matrix.platform.triplet }}
          path: out/pair-${{ matrix.platform.triplet }}/
          retention-days: 7

  release:
    name: publish
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
    needs: [image, pair]
    # A job-level block REPLACES the workflow-level grant, so contents +
    # pull-requests are restated; attestations/id-token arm the SLSA L3
    # provenance step at the job tail (same tag gate — push/PR runs
    # never run this job, so they never attest).
    permissions:
      contents: write
      pull-requests: write
      attestations: write
      id-token: write
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # The fleet identity (tebako-release#3): installation tokens of the
      # tebako-fleet App — own rate budget, and app-pushed branches fire
      # pull_request CI (a GITHUB_TOKEN never does). The registry-org
      # token is minted for the tebako-packages installation because the
      # aggregate wake dispatches into tebako-packages/registry. Minted
      # before the checkout: the checkout itself rides the fleet token so
      # the registry bot branch's push is the App's doing as well
      # (tebako#686 — the publish step below).
      - name: Mint the fleet token
        id: fleet
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.TEBAKO_CI_APP_ID }}
          private-key: ${{ secrets.TEBAKO_CI_APP_PRIVATE_KEY }}
      - name: Mint the registry-org token
        id: fleet_registry
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.TEBAKO_CI_APP_ID }}
          private-key: ${{ secrets.TEBAKO_CI_APP_PRIVATE_KEY }}
          owner: tebako-packages
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.fleet.outputs.token }}
      - name: Collect payloads (all legs)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*"
          path: out/
          merge-multiple: false
      - name: Restore layout
        shell: bash
        run: |
          set -e
          for d in out/payload-*/; do
            p="${d#out/payload-}"; p="${p%/}"
            mkdir -p "out/pair-$p"
            mv "$d"* "out/pair-$p/"
            rmdir "$d"
          done
          # out/image-universal/ → out/image/
          mkdir -p out/image
          mv out/image-universal/* out/image/
          rmdir out/image-universal
      # The runtime release flow (spec 28 §6): the tag IS the tebako
      # product line (v<line>, the trr convention — the resolver's
      # {base}/v<tebako_version>/<asset> URL shape answers it). jruby has
      # ONE flavor on ONE line — a tag ships everything here.
      - name: Read the toolchain pins (Tebakofile is the SSOT)
        run: ruby tools/pins.rb macos-arm64 jvm --env >> "$GITHUB_ENV"
      - name: Create the release + upload the runtime pair assets
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          gh release create "$tag" --repo tamatebako/tebako-runtime-jruby \
            --title "$tag — tebako-runtime jruby (JRuby $PKG_VERSION, universal image on the java owner)" \
            --notes "tebako ruby:jruby runtime (spec 33 on_runtime): ONE universal env image + the per-triplet wrapper exe; manifest.json is the release index, SHA256SUMS.txt the trust anchor." \
            || gh release view "$tag" --repo tamatebako/tebako-runtime-jruby > /dev/null

          # Skip-if-current upload (tebako-runtime-ruby#189's wedge
          # lesson, proven by probe 2026-09-23): a DELETED asset name
          # 422-blocks re-uploads for hours, and bulk deletes wedge a
          # whole release. Payload names are byte-immutable per name: an
          # absent name uploads, a same-digest name skips, a
          # different-bytes name is KEPT loudly (the remedy is
          # `status: withdrawn` in the registry + the next patch line —
          # never a delete).
          asset_digest() { # $1=asset name → served sha256 or empty
            gh api "repos/tamatebako/tebako-runtime-jruby/releases/tags/$tag" \
              --jq ".assets[] | select(.name == \"$1\") | .digest" | sed 's/^sha256://'
          }
          upload_write_once() { # $1=local file
            local file="$1" name want have
            name="$(basename "$file")"
            want="$(shasum -a 256 "$file" | cut -d' ' -f1)"
            have="$(asset_digest "$name")"
            if [ -z "$have" ]; then
              gh release upload "$tag" --repo tamatebako/tebako-runtime-jruby "$file"
            elif [ "$have" = "$want" ]; then
              echo "$name is already current on the release — skipping"
            else
              echo "::warning::$name is already served with DIFFERENT bytes — keeping the served asset (byte-immutable per name; a bad asset's remedy is the registry's withdrawn mark + the next patch line)"
            fi
          }
          # The universal image + its sidecar (the image leg's artifact).
          upload_write_once "out/image/$RUNTIME_IMAGE_STEM.tfs"
          upload_write_once "out/image/$RUNTIME_IMAGE_STEM.tfs.sha256"
          # The lazy-mount sidecar and its anchor (spec 39 §3; tebako#868).
          upload_write_once "out/image/$RUNTIME_IMAGE_STEM.tfs.blksum.json"
          upload_write_once "out/image/$RUNTIME_IMAGE_STEM.tfs.blksum.json.sha256"
          # Per-triplet: the exe + sidecar + shard (never the sibling
          # payload-*.yaml). The windows legs' exe carries .exe (the
          # shard's filename names it) — resolve the on-disk exe name
          # from the shard stem, never a hardcoded suffix.
          for shard in out/pair-*/tebako-runtime-*.manifest.json; do
            dir="$(dirname "$shard")"
            stem="$(basename "$shard" .manifest.json)"
            exe="$stem"
            [ -f "$dir/$exe" ] || exe="$stem.exe"
            [ -f "$dir/$exe" ] || { echo "::error::no exe beside $shard (looked for $stem and $stem.exe)"; exit 1; }
            upload_write_once "$dir/$exe"
            upload_write_once "$dir/$exe.sha256"
            upload_write_once "$shard"
          done
      - name: Derive + upload the monoliths (manifest.json + SHA256SUMS.txt)
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          ruby -rjson -e 'puts JSON.pretty_generate(ARGV.sort.map { |f| JSON.parse(File.read(f)) })' \
            out/pair-*/tebako-runtime-*.manifest.json > manifest.json
          cat out/pair-*/tebako-runtime-*.sha256 \
              "out/image/$RUNTIME_IMAGE_STEM.tfs.sha256" \
              "out/image/$RUNTIME_IMAGE_STEM.tfs.blksum.json.sha256" > SHA256SUMS.txt
          # The derived monoliths are metadata — pure functions of the
          # served shards — so a drifted one is debris and replaces (a
          # single-asset replace is the probe-proven safe case; the wedge
          # is the BULK delete). Already-current skips.
          for mono in manifest.json SHA256SUMS.txt; do
            want="$(shasum -a 256 "$mono" | cut -d' ' -f1)"
            have="$(gh api "repos/tamatebako/tebako-runtime-jruby/releases/tags/$tag" \
              --jq ".assets[] | select(.name == \"$mono\") | .digest" | sed 's/^sha256://')"
            if [ "$have" = "$want" ]; then
              echo "$mono is already current on the release — skipping"
            else
              gh release upload --clobber "$tag" --repo tamatebako/tebako-runtime-jruby "$mono"
            fi
          done

      # Signing parity with the sibling runtime factories (spec 09 §5):
      # every served name carries a detached `.asc`, signed by the ONE
      # release machinery (tebako-release) over the bytes the release
      # listing serves. The gate keeps unsigned first-class — with
      # TEBAKO_RELEASE_SIGNING_ENABLED unset the pass prints its disarm
      # line and exits 0, so this step runs on every publish and can never
      # take a release down. Armed, it needs TEBAKO_RELEASE_SIGNING_KEY
      # (the house secret the sibling factories use) and signs whatever the
      # listing shows as stale, `.asc` included in the coverage assertion.
      - name: Set up ruby for the release machinery
        if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Sign the release assets (spec 09 §5)
        if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ steps.fleet.outputs.token }}
          GH_TOKEN: ${{ steps.fleet.outputs.token }}
          TEBAKO_RELEASE_REPO: ${{ github.repository }}
          TEBAKO_RELEASE_SIGNING_ENABLED: ${{ vars.TEBAKO_RELEASE_SIGNING_ENABLED }}
          TEBAKO_RELEASE_SIGNING_KEY: ${{ secrets.TEBAKO_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          # The tag IS the line here; the machinery derives v<VERSION> when
          # no explicit tag is given, so both spellings are passed.
          TEBAKO_RELEASE_TAG="$GITHUB_REF_NAME"
          TEBAKO_VERSION="${GITHUB_REF_NAME#v}"
          export TEBAKO_RELEASE_TAG TEBAKO_VERSION
          bundle exec tebako-release sign

      # SLSA L3 provenance over the exact bytes this tag ships — the
      # universal image + its sidecar, each triplet's wrapper exe +
      # sidecar + shard, and the manifest.json + SHA256SUMS.txt trust
      # anchors. The staging copy mirrors the upload loops' name lists
      # verbatim, so the non-shipped sibling payload-*.yaml files are
      # never attested. Gated with the job (tag runs only — push/PR runs
      # never attest).
      - name: Stage the attestation subjects (the exact served names)
        if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p attest-staging
          cp "out/image/$RUNTIME_IMAGE_STEM.tfs" "out/image/$RUNTIME_IMAGE_STEM.tfs.sha256" \
             "out/image/$RUNTIME_IMAGE_STEM.tfs.blksum.json" "out/image/$RUNTIME_IMAGE_STEM.tfs.blksum.json.sha256" \
             attest-staging/
          for shard in out/pair-*/tebako-runtime-*.manifest.json; do
            dir="$(dirname "$shard")"
            stem="$(basename "$shard" .manifest.json)"
            exe="$stem"
            [ -f "$dir/$exe" ] || exe="$stem.exe"
            cp "$dir/$exe" "$dir/$exe.sha256" "$shard" attest-staging/
          done
          cp manifest.json SHA256SUMS.txt attest-staging/
      # The detached signatures are part of what this tag ships, so they
      # are attested with the rest — read back from the release (the signer
      # converged them there; it keeps no second copy) and only when the
      # signing arm produced them.
      - name: Stage the signature sidecars
        if: ${{ always() && startsWith(github.ref, 'refs/tags/') && vars.TEBAKO_RELEASE_SIGNING_ENABLED == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --repo tamatebako/tebako-runtime-jruby \
            --pattern '*.asc' --dir attest-staging --clobber
          ls attest-staging/*.asc | wc -l
      - name: Attest build provenance
        if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: attest-staging/*
      # The registry mirrors resolution fields only (L3): the env image
      # is the named artifact per platform — the SAME universal asset
      # under every platform key (a consequence of the pinned universal
      # image); kind: runtime carries NO entrypoints key.
      - name: Render the registry entry
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          img_sha="$(cut -d' ' -f1 "out/image/$RUNTIME_IMAGE_STEM.tfs.sha256")"
          blk_sha="$(cut -d' ' -f1 "out/image/$RUNTIME_IMAGE_STEM.tfs.blksum.json.sha256")"
          sed -e "s|@@VERSION@@|$PKG_VERSION|g" \
              -e "s|@@IMAGE_STEM@@|$RUNTIME_IMAGE_STEM|g" \
              -e "s|@@TAG@@|$tag|g" \
              -e "s|@@IMAGE_SHA256@@|$img_sha|g" \
              -e "s|@@BLKSUM_SHA256@@|$blk_sha|g" \
              manifests/registry.yaml > tpkg-registry.yaml
      # main is branch-protected (and the GitHub-Actions bypass is not
      # available on this plan): the registry lands by bot PR + auto-merge,
      # never by direct push. Idempotent across re-runs of the same tag.
      # The PR is created AND merged under the fleet App's token
      # (tebako#686, tebako-release#3): a GITHUB_TOKEN-authored PR never
      # triggers pull_request workflows, so its checks would sit pending
      # forever and auto-merge would never fire.
      - name: Publish the registry entry via pull request
        env:
          GH_TOKEN: ${{ steps.fleet.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name "tebako-ci"
          git config user.email "tebako@ribose.com"
          git fetch origin main
          # intent-to-add: git diff does not see UNTRACKED files — without
          # this the first-ever publish (main has no tpkg-registry.yaml yet)
          # silently reports "unchanged" and no registry PR opens (the
          # v2.5.0 publish, 2026-09-07).
          git add -N tpkg-registry.yaml
          if git diff --quiet origin/main -- tpkg-registry.yaml; then
            echo "registry unchanged (or the entry already landed on main)"
            exit 0
          fi
          branch="publish/${{ github.ref_name }}-registry"
          git checkout -b "$branch"
          git add tpkg-registry.yaml
          git commit -m "publish ${{ github.ref_name }}: registry entry"
          # force-with-lease on the bot branch: a re-publish re-creates it
          git push --force-with-lease origin "$branch"
          # tebako#1050: re-dispatch safety (the ruby coordinator's shape,
          # mirrored). The probe is state-filtered and a probe failure is a
          # named error — a swallowed transport error (a 502 in the lookup)
          # must never read as "no PR", or the create dies on
          # already-exists and a re-dispatch fails deterministically
          # (the python factory's v0.3.5 publish, run 43370376600 attempt 2).
          probe() { gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty'; }
          if ! number="$(probe)"; then
            echo "::error::could not query the open PRs for $branch — refusing to guess (a wrong guess duplicates the PR or strands the render)"
            exit 1
          fi
          if [ -z "$number" ]; then
            if ! create_out="$(gh pr create --base main --head "$branch" \
                                --title "publish ${{ github.ref_name }}: registry entry" \
                                --body "Automated registry entry for ${{ github.ref_name }} (the build-payload publish job; main is protected, so the registry lands by PR)." 2>&1)"; then
              case "$create_out" in
                *"already exists"*)
                  # The probe→create race (a concurrent attempt opened the
                  # PR between the two): the push above already delivered
                  # the render to the branch the PR tracks.
                  echo "$create_out"
                  ;;
                *)
                  echo "$create_out" >&2
                  exit 1
                  ;;
              esac
            fi
            number="$(probe)" || true
            [ -n "${number:-}" ] || { echo "::error::$branch: the PR was created but could not be re-resolved"; exit 1; }
          else
            echo "registry PR #$number already open for $branch (a re-dispatch) — the force-push healed the head; reusing it"
          fi
          gh pr merge --auto --squash "$branch" || gh pr merge --squash "$branch"
      # The official registry aggregates these per-factory registries on a
      # six-hour cron (spec 37 §6's pull model), so without this a fresh
      # publish stays invisible to `tebako install` for up to six hours.
      # The dispatch is the immediacy half, and it fires AFTER the entry
      # lands: the aggregate re-reads the factory's file, so waking it
      # first would rebuild the same stale rows.
      - name: Wake the official registry (immediacy dispatch)
        if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ steps.fleet_registry.outputs.token }}
        run: |
          set -euo pipefail
          branch="publish/${GITHUB_REF_NAME}-registry"
          # `--auto` returns before the merge happens; wait for it, but
          # never fail the publish on the wait — the cron is the floor.
          for _ in $(seq 1 30); do
            state="$(gh pr view "$branch" --json state --jq .state 2>/dev/null || echo UNKNOWN)"
            [ "$state" = "MERGED" ] && break
            sleep 10
          done
          echo "registry PR '$branch' state: ${state:-UNKNOWN}"
          gh api repos/tebako-packages/registry/dispatches \
            -f event_type=feedstock-published \
            -f "client_payload[repo]=$GITHUB_REPOSITORY" \
            -f "client_payload[tag]=$GITHUB_REF_NAME"
          echo "woke the official registry for $GITHUB_REPOSITORY $GITHUB_REF_NAME"
